<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="icon" type="image/x-icon" href="./assets/img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    </head>

<body>
<section class="informacoes">
    <h1 class="titulo">Lista de Tarefas</h1>
    <div class="search-bar">
        <div class="row">
            <input type="text" id="barra-pesquisa" placeholder="Pesquisar tarefas..."
            autocomplete="off">
            <button id="botao-pesquisa"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </div>
    <p>
        <input type="text" class="input-nova-tarefa" placeholder="Adicionar nova tarefa..." autocomplete="off">
        <button class="add-tarefa"><i class="fa-solid fa-plus"></i></button>
    </p>
    <ul class="tarefas"></ul>
<div class="theme-selector">
    <button id="theme-button" class="theme-button">
        <i class="fa-solid fa-circle-half-stroke"></i>
    </button>
    <div id="theme-popup" class="theme-popup">
        <button class="theme-option" data-theme="light-pink">Rosa Claro</button>
        <button class="theme-option" data-theme="github">GitHub</button>
        <button class="theme-option" data-theme="dark-blue">Azul Escuro</button>
    </div>
</div>
</section>
    <script src="./assets/js/main.js"></script>
    <script src="https://kit.fontawesome.com/f290c1a2af.js" crossorigin="anonymous"></script>
</body>

</html>
